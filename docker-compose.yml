version: '3.8'

services:
  postgres:
    image: postgres:16.8-alpine
    container_name: bitbybit_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dhruvbitbybit
      POSTGRES_DB: bitbybit
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bitbybit}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis_app:
    image: redis:7.2.7-alpine
    container_name: bitbybit_redis_app
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_app_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

volumes:
  pgdata:
    driver: local
  redis_app_data:
    driver: local

networks:
  app-network:
    driver: bridge
